# ==========================================
# Application
# ==========================================
spring.application.name=StoreHub


# ==========================================
# Database
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL}


# ==========================================
# Mail
# ==========================================
spring.mail.host=smtp.gmail.com;
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED}


# ==========================================
# JWT
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}


# ==========================================
# Async Thread Pool
# ==========================================
spring.task.execution.pool.core-size=${ASYNC_CORE_SIZE}
spring.task.execution.pool.max-size=${ASYNC_MAX_SIZE}


# ==========================================
# Server
# ==========================================
server.port=8080


# ==========================================
# Swagger
# ==========================================
springdoc.api-docs.path=${SWAGGER_API_DOCS_PATH}
springdoc.swagger-ui.path=${SWAGGER_UI_PATH}


# ==========================================
# Logging
# ==========================================
logging.level.com.storehub=DEBUG
logging.level.org.springframework.security=INFO


# ==========================================
# Seed Users
# ==========================================
seed.admin-password=${SEED_ADMIN_PASSWORD}
seed.facility-manager-password=${SEED_FACILITY_MANAGER_PASSWORD}
seed.business-manager-password=${SEED_BUSINESS_MANAGER_PASSWORD}
seed.staff-password=${SEED_STAFF_PASSWORD}
seed.customer-password=${SEED_CUSTOMER_PASSWORD}